name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 允许 GitHub Pages 与 GITHUB_TOKEN 的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 需与 github-pages 环境关联，才能读取该环境的 secrets（VITE_AMAP_KEY 等）
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          # 站点部署在 /metro-catchment/ 子路径
          VITE_BASE: /metro-catchment/
          # 从 github-pages 环境的 secrets 读取；未配置时运行于「演示模式」
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
